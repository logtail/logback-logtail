name: E2E

# Proves that the client still delivers logs to Better Stack. Every job creates its own java source through the
# Telemetry API, warms it up, runs one of the example projects (examples/maven or examples/gradle, the way its README
# tells customers to) with that source's token and ingesting host, reads the stored rows back through the testing
# team's SQL API connection, checks them exactly against e2e/expected-<maven or gradle>.json (nothing missing, extra
# or duplicated), and deletes the source again, together with sources of earlier runs left behind for more than 3
# hours. e2e/plan.sh plans three legs, each with both example projects:
#   floor   JDK 8 (pom.xml's maven.compiler.source) with logback-classic and jackson-databind as pom.xml pins them,
#           and the slf4j-api that logback release was built with
#   latest  the newest GA JDK with the newest logback-classic, jackson-databind and slf4j-api releases
#   canary  the next JDK as an early-access build, with a logback, Jackson or slf4j pre-release when one is newer
# The floor leg runs on the oldest Ubuntu image GitHub offers, latest and canary on ubuntu-latest, so a new runner image
# is covered as well.
# Maven or Gradle resolving any version other than the planned one fails the job before a source is created.
# Pushes to main and pull requests install the client built from the checkout, as the Release workflow builds it,
# into the local Maven repository, where the examples find the version they pin. The daily schedule takes the newest
# release from Maven Central instead, which is what a customer gets today, and fails when the examples do not pin it.
# A failure on main or on the schedule files a Linear issue (notify_linear_failure.yml), at low priority when only the
# canary failed. Pull requests from forks run only the plan: they get no secrets, so they cannot create a source.
#
# Secrets: TEST_TEAM_TELEMETRY_API, TEST_TEAM_CONNECTION_USERNAME, TEST_TEAM_CONNECTION_PASSWORD (Better Stack's E2E
# testing team), LINEAR_* (see notify_linear_failure.yml).
#
# One leg, or exact versions: Actions → E2E → Run workflow, pick the leg and the example project and optionally set
# jdk-version (e.g. 17.0.12 or 26-ea), logback-version or jackson-version, which replace the planned versions of
# every leg that runs. That is how a failure is bisected to one release.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      leg:
        description: 'Leg to run'
        type: choice
        options: [all, floor, latest, canary]
        default: all
      tool:
        description: 'Example project to run'
        type: choice
        options: [all, maven, gradle]
        default: all
      source:
        description: 'checkout: the client built from this checkout, as the Release workflow builds it. central: its newest release on Maven Central, what a customer gets'
        type: choice
        options: [checkout, central]
        default: checkout
      jdk-version:
        description: 'One exact JDK version (e.g. 17.0.12 or 26-ea) instead of the planned one'
        type: string
      logback-version:
        description: 'One exact logback-classic version (e.g. 1.3.16) instead of the planned one, with the slf4j-api it was built with'
        type: string
      jackson-version:
        description: 'One exact jackson-databind version (e.g. 2.17.3) instead of the planned one'
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: "[Setup] Checkout code"
        uses: actions/checkout@v7

      - name: "[Setup] Plan the legs"
        id: plan
        env:
          LEG: ${{ inputs.leg || 'all' }}
          TOOL: ${{ inputs.tool || 'all' }}
          JDK_VERSION: ${{ inputs.jdk-version }}
          LOGBACK_VERSION: ${{ inputs.logback-version }}
          JACKSON_VERSION: ${{ inputs.jackson-version }}
          # The schedule tests what a customer gets today, pushes and pull requests test the checkout.
          CLIENT_FROM: ${{ github.event_name == 'schedule' && 'central' || inputs.source || 'checkout' }}
        run: |
          MATRIX=$(bash e2e/plan.sh)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          jq . <<<"$MATRIX"

  test:
    needs: plan
    name: ${{ matrix.name }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      LEG: ${{ matrix.leg }}
      TOOL: ${{ matrix.tool }}
      JDK: ${{ matrix.jdk_major }}
      LOGBACK: ${{ matrix.logback }}
      JACKSON: ${{ matrix.jackson }}
      SLF4J: ${{ matrix.slf4j }}
      CLIENT_FROM: ${{ matrix.source }}
      CLIENT: ${{ matrix.client }}

    steps:
      - name: "[Setup] Checkout code"
        uses: actions/checkout@v7

      # Listed last, JDK 21 becomes JAVA_HOME: it builds the client, as in the Release workflow, and runs Gradle 9,
      # which needs 17 or newer. e2e/example.sh finds the leg's JDK through JAVA_HOME_<major>_X64.
      - name: "[Setup] JDK ${{ matrix.jdk }} and JDK 21"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.jdk }}
            21

      - name: "[Setup] Install the client"
        run: |
          if [ "$CLIENT_FROM" = central ]; then
            echo "The examples take logback-logtail from Maven Central, where $CLIENT is the newest release."
          else
            # The jar the Release workflow builds and publishes, into the local Maven repository.
            mkdir -p out
            mvn -B -ntp clean install -Dmaven.test.skip=true 2>&1 | tee out/install.log || {
              echo "::error::Building the client failed: $(sed -n '/^\[ERROR\]/{p;q;}' out/install.log)"
              exit 1
            }
          fi

      # Before a source is created: an example that cannot even compile with these versions needs no round trip.
      - name: "[Verify] The example compiles with the leg's versions"
        run: bash e2e/example.sh classpath

      - name: "[Verify] Resolved versions are the planned ones"
        run: |
          # The version of a jar on the example's runtime classpath, from its file name.
          resolved() { sed -n "s:.*/$1-\([^/]*\)\.jar$:\1:p" out/classpath.txt; }
          # sed reads all of the output: head would close the pipe early, and pipefail would fail the step.
          JAVA=$("$(printenv "JAVA_HOME_${JDK}_X64")/bin/java" -version 2>&1 | sed -n 1p)
          if [ "$TOOL" = maven ]; then BUILD=$(mvn -v | sed -n 1p); else BUILD=$(gradle --version | sed -n '/^Gradle/p'); fi
          echo "- $JAVA, $BUILD, logback-logtail $(resolved logback-logtail) from $CLIENT_FROM, logback-classic $(resolved logback-classic), jackson-databind $(resolved jackson-databind), slf4j-api $(resolved slf4j-api)" | tee -a out/versions.md "$GITHUB_STEP_SUMMARY"
          FAILED=0
          for check in "logback-logtail $CLIENT" "logback-classic $LOGBACK" "jackson-databind $JACKSON" "slf4j-api $SLF4J"; do
            read -r name want <<<"$check"
            got=$(resolved "$name")
            if [ "$got" != "$want" ]; then
              echo "::error::$TOOL resolved $name ${got:-to nothing}, but the $LEG leg plans $want."
              FAILED=1
            fi
          done
          # The client from the checkout must be the jar just built, not one from Maven Central with the same version.
          if [ "$CLIENT_FROM" = checkout ] && ! cmp -s "target/logback-logtail-$CLIENT.jar" "$(grep '/logback-logtail-[^/]*\.jar$' out/classpath.txt)"; then
            echo "::error::$TOOL did not take logback-logtail $CLIENT from the local Maven repository, where the checkout's build is."
            FAILED=1
          fi
          exit "$FAILED"

      - name: "[Setup] Create a source"
        id: source
        uses: ./.github/actions/create-source
        with:
          api-token: ${{ secrets.TEST_TEAM_TELEMETRY_API }}
          name: e2e-java-gh${{ github.run_id }}a${{ github.run_attempt }}-${{ matrix.leg }}-${{ matrix.tool }}
          platform: java

      - name: "[Test] Run the example project"
        env:
          BETTER_STACK_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          BETTER_STACK_INGESTING_HOST: ${{ steps.source.outputs.ingesting-host }}
        run: bash e2e/example.sh run

      - name: "[Verify] Read the rows back"
        uses: ./.github/actions/verify-logs
        with:
          connection-username: ${{ secrets.TEST_TEAM_CONNECTION_USERNAME }}
          connection-password: ${{ secrets.TEST_TEAM_CONNECTION_PASSWORD }}
          connect-host: ${{ steps.source.outputs.connect-host }}
          collection: ${{ steps.source.outputs.collection }}
          expected: e2e/expected-${{ matrix.tool }}.json

      - name: "[Cleanup] Delete this job's source and stale ones of earlier runs"
        if: ${{ always() }}
        uses: ./.github/actions/cleanup-sources
        with:
          api-token: ${{ secrets.TEST_TEAM_TELEMETRY_API }}
          prefix: e2e-java-
          id: ${{ steps.source.outputs.id }}

      - name: "[Report] Job summary"
        if: ${{ always() }}
        run: |
          if [ -f out/summary.md ]; then
            { echo; cat out/summary.md; } >> "$GITHUB_STEP_SUMMARY"
            # The Linear issue names the job and links the run, so it gets the versions, the read-back and the
            # cleanup only when that left something behind. Without a read-back summary the notifier takes the
            # job's ::error:: lines instead.
            mkdir -p report
            { cat out/versions.md; echo; cat out/summary.md; } > report/summary.md
            if grep -q '❌' out/cleanup.md 2>/dev/null; then { echo; cat out/cleanup.md; } >> report/summary.md; fi
          else
            { echo; echo "❌ Stopped before the rows were read back, see the failed step."; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/cleanup.md ]; then { echo; cat out/cleanup.md; } >> "$GITHUB_STEP_SUMMARY"; fi

      - name: "[Report] Hand the summary to the Linear issue"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-summary-${{ matrix.name }}
          path: report/summary.md
          if-no-files-found: ignore
          retention-days: 7
          # A re-run attempt uploads under the same name.
          overwrite: true

  notify-linear:
    if: ${{ failure() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule') }}
    needs: [test]
    # The notifier reads the failed jobs, their summary artifacts and their annotations.
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/notify_linear_failure.yml
    with:
      job_summaries: true
    secrets: inherit
