name: Java Build
on:
   push:
      branches:
      - main
   pull_request:
      types:
      - opened
      - synchronize
      - reopened
   workflow_dispatch:

jobs:
   build:
      runs-on: ubuntu-latest

      strategy:
         matrix:
            java-version: [ 8, 11, 17, 21, 25 ]
         fail-fast: false

      steps:
      -  name: Checkout project
         uses: actions/checkout@v7
         with:
            fetch-depth: 0
      -  name: Set up JDK
         uses: actions/setup-java@v6
         with:
            distribution: temurin
            java-version: ${{ matrix.java-version }}
      -  name: Cache Maven packages
         uses: actions/cache@v6
         with:
            path: ~/.m2
            key: ${{ runner.os }}-m2-java${{ matrix.java-version }}-${{ hashFiles('**/pom.xml') }}
            restore-keys: ${{ runner.os }}-m2
      -  name: Build with Maven
         timeout-minutes: 5
         # Maven Central answers a burst of downloads from a shared runner address with HTTP 429.
         # 6 retries 10 s apart wait up to 210 s, instead of 3 retries within 30 s. Maven 3.9 reads the
         # aether.connector names, Maven 3.10 and later read the aether.transport names.
         env:
            MAVEN_ARGS: >-
               -Daether.connector.http.retryHandler.count=6 -Daether.connector.http.retryHandler.interval=10000
               -Daether.transport.http.retryHandler.count=6 -Daether.transport.http.retryHandler.interval=10000
         run: mvn -B clean package --file pom.xml
