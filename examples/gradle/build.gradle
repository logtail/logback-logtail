plugins {
    id 'application'
}

// Override any of them on the command line, e.g. gradle run -PlogbackVersion=1.3.16
def logbackVersion = findProperty('logbackVersion') ?: '1.5.38'
def jacksonVersion = findProperty('jacksonVersion') ?: '2.22.3'
def slf4jVersion = findProperty('slf4jVersion') ?: '2.0.17'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.logtail:logback-logtail:0.4.0'
    implementation "ch.qos.logback:logback-classic:$logbackVersion"
    implementation "ch.qos.logback:logback-core:$logbackVersion"
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jacksonVersion"
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
}

application {
    mainClass = 'com.logtail.example.App'
}
